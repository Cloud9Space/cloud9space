<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-label="What happens when a user zooms the map. With WMS, the browser asks for a new image and the server reads the data and draws it on every request. With vector tiles, the browser asks only for new tiles, the server hands out ready tiles, and the browser draws the map itself.">
<style>
.t{font:600 28px Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#1C1C1A} .s{font:400 17px Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#5F5E5A}
.h{font:600 18px Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#1C1C1A} .b{font:400 15px Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#5F5E5A}
.n{font:600 15px Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif} .p{font:600 17px Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#FFFFFF} .f{font:600 15.5px Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.box{fill:#FFFFFF;stroke:#D6D3CC;stroke-width:1.5}
</style><rect width="100%" height="100%" fill="#FFFFFF"/>
<text class="t" x="40" y="56">What happens every time a user zooms the map</text>
<text class="s" x="40" y="88">The same zoom, two very different amounts of work for the server.</text>
<rect x="40" y="116" width="550" height="504" rx="16" fill="#FBF1EC" stroke="#E8C6B6" stroke-width="1.5"/>
<rect x="68" y="140" width="74" height="34" rx="17" fill="#B9481F"/><text class="p" x="105.0" y="163" text-anchor="middle">WMS</text>
<text class="s" x="68" y="204">The server paints a new picture each time</text>
<rect class="box" x="68" y="226" width="494" height="74" rx="12"/>
<circle cx="104" cy="263" r="16" fill="#F6DCCF"/><text class="n" x="104" y="268" text-anchor="middle" fill="#B9481F">1</text>
<text class="h" x="136" y="258">User zooms or pans</text><text class="b" x="136" y="282">the view on screen changes</text>
<line x1="315" y1="300" x2="315" y2="318" stroke="#BDBAB3" stroke-width="1.5"/>
<rect class="box" x="68" y="318" width="494" height="74" rx="12"/>
<circle cx="104" cy="355" r="16" fill="#F6DCCF"/><text class="n" x="104" y="360" text-anchor="middle" fill="#B9481F">2</text>
<text class="h" x="136" y="350">Browser asks for a new image</text><text class="b" x="136" y="374">the old picture stretches and blurs</text>
<line x1="315" y1="392" x2="315" y2="410" stroke="#BDBAB3" stroke-width="1.5"/>
<rect class="box" x="68" y="410" width="494" height="74" rx="12"/>
<circle cx="104" cy="447" r="16" fill="#F6DCCF"/><text class="n" x="104" y="452" text-anchor="middle" fill="#B9481F">3</text>
<text class="h" x="136" y="442">Server reads the data and draws</text><text class="b" x="136" y="466">GeoServer, MapServer</text>
<line x1="315" y1="484" x2="315" y2="502" stroke="#BDBAB3" stroke-width="1.5"/>
<rect class="box" x="68" y="502" width="494" height="74" rx="12"/>
<circle cx="104" cy="539" r="16" fill="#F6DCCF"/><text class="n" x="104" y="544" text-anchor="middle" fill="#B9481F">4</text>
<text class="h" x="136" y="534">Browser shows the PNG</text><text class="b" x="136" y="558">just pixels, nothing to click</text>
<circle cx="74" cy="595" r="5" fill="#B9481F"/><text class="f" x="88" y="600" fill="#B9481F">Hard work happens on the server, on every request</text>
<rect x="610" y="116" width="550" height="504" rx="16" fill="#EDF5F0" stroke="#BFDCCB" stroke-width="1.5"/>
<rect x="638" y="140" width="132" height="34" rx="17" fill="#23704F"/><text class="p" x="704.0" y="163" text-anchor="middle">Vector tiles</text>
<text class="s" x="638" y="204">The browser draws from shapes it already has</text>
<rect class="box" x="638" y="226" width="494" height="74" rx="12"/>
<circle cx="674" cy="263" r="16" fill="#D3E9DC"/><text class="n" x="674" y="268" text-anchor="middle" fill="#23704F">1</text>
<text class="h" x="706" y="258">User zooms or pans</text><text class="b" x="706" y="282">the view on screen changes</text>
<line x1="885" y1="300" x2="885" y2="318" stroke="#BDBAB3" stroke-width="1.5"/>
<rect class="box" x="638" y="318" width="494" height="74" rx="12"/>
<circle cx="674" cy="355" r="16" fill="#D3E9DC"/><text class="n" x="674" y="360" text-anchor="middle" fill="#23704F">2</text>
<text class="h" x="706" y="350">Browser asks only for new squares</text><text class="b" x="706" y="374">tiles it has seen stay in memory</text>
<line x1="885" y1="392" x2="885" y2="410" stroke="#BDBAB3" stroke-width="1.5"/>
<rect class="box" x="638" y="410" width="494" height="74" rx="12"/>
<circle cx="674" cy="447" r="16" fill="#D3E9DC"/><text class="n" x="674" y="452" text-anchor="middle" fill="#23704F">3</text>
<text class="h" x="706" y="442">Server hands out ready tiles</text><text class="b" x="706" y="466">Martin, a PMTiles file</text>
<line x1="885" y1="484" x2="885" y2="502" stroke="#BDBAB3" stroke-width="1.5"/>
<rect class="box" x="638" y="502" width="494" height="74" rx="12"/>
<circle cx="674" cy="539" r="16" fill="#D3E9DC"/><text class="n" x="674" y="544" text-anchor="middle" fill="#23704F">4</text>
<text class="h" x="706" y="534">Browser draws the map itself</text><text class="b" x="706" y="558">sharp lines, instant colours and clicks</text>
<circle cx="644" cy="595" r="5" fill="#23704F"/><text class="f" x="658" y="600" fill="#23704F">Hard work happens in the browser; the server stays light</text>
</svg>
