<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-label="How a request reaches the right data: verify identity, resolve placement, check the tenant is authorised and active or reject, query the selected destination, then end the transaction and release the connection.">
<style>
.t{font:600 28px Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#1C1C1A}
.s{font:400 17px Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#5F5E5A}
.h{font:600 19px Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#1C1C1A}
.b{font:400 15.5px Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#5F5E5A}
.m{font:400 16px "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3A3A37}
.k{font:600 12.5px Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#7A7873;letter-spacing:.12em}
.l{font:500 14px Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#5F5E5A}
.box{fill:#FFFFFF;stroke:#D6D3CC;stroke-width:1.5}
.acc{fill:#E9F0FB;stroke:#2F6FDB;stroke-width:2}
.pan{fill:#F3F1EC;stroke:#D6D3CC;stroke-width:1.5}
.ln{stroke:#9C9A94;stroke-width:1.75;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9C9A94"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text class="t" x="40" y="56">How a request reaches the right data</text>
<text class="s" x="40" y="88">The same checks apply to both storage models.</text>
<rect class="box" x="560" y="124" width="590" height="76" rx="12"/>
<text class="h" x="855" y="156" text-anchor="middle">1   Verify identity</text>
<text class="b" x="855" y="182" text-anchor="middle">Confirm the login and the user's membership of this tenant</text>
<path class="ln" d="M855 200V222" marker-end="url(#a)"/>
<rect class="box" x="560" y="226" width="590" height="76" rx="12"/>
<text class="h" x="855" y="258" text-anchor="middle">2   Resolve placement</text>
<text class="b" x="855" y="284" text-anchor="middle">Registry: tenant → schema or database</text>
<path class="ln" d="M855 302V324" marker-end="url(#a)"/>
<rect class="acc" x="560" y="328" width="590" height="76" rx="12"/>
<text class="h" x="855" y="360" text-anchor="middle">3   Authorised, active, and does the storage exist?</text>
<text class="b" x="855" y="386" text-anchor="middle">Anything unknown or inactive stops here</text>
<path class="ln" d="M855 404V448" marker-end="url(#a)"/>
<text class="l" x="870" y="432">Yes</text>
<rect class="box" x="560" y="452" width="590" height="76" rx="12"/>
<text class="h" x="855" y="484" text-anchor="middle">4   Query the selected destination</text>
<text class="b" x="855" y="510" text-anchor="middle">Tenant context set per transaction, least-privilege role</text>
<path class="ln" d="M855 528V550" marker-end="url(#a)"/>
<rect class="box" x="560" y="554" width="590" height="76" rx="12"/>
<text class="h" x="855" y="586" text-anchor="middle">5   End the transaction, release the connection</text>
<text class="b" x="855" y="612" text-anchor="middle">Nothing tenant-specific survives into the next request</text>
<path class="ln" d="M560 366H464" marker-end="url(#a)"/>
<text class="l" x="512" y="354" text-anchor="middle">No</text>
<rect x="50" y="328" width="410" height="76" rx="12" fill="#FDF3EE" stroke="#C4532B" stroke-width="1.75" stroke-dasharray="7 5"/>
<text class="h" x="255" y="360" text-anchor="middle">Reject the request</text>
<text class="b" x="255" y="386" text-anchor="middle">Fail closed. Never guess a destination.</text>
<text class="b" x="255" y="482" text-anchor="middle">Background jobs and caches</text>
<text class="b" x="255" y="506" text-anchor="middle">must carry tenant context too.</text>
</svg>
