<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" width="1200" height="570" role="img" aria-label="Schema per tenant. One database holds a separate set of tables for each customer.">
<style>
.t{font:600 28px Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#1C1C1A}
.s{font:400 17px Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#5F5E5A}
.h{font:600 19px Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#1C1C1A}
.b{font:400 15.5px Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#5F5E5A}
.m{font:400 16px "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3A3A37}
.k{font:600 12.5px Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#7A7873;letter-spacing:.12em}
.l{font:500 14px Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#5F5E5A}
.box{fill:#FFFFFF;stroke:#D6D3CC;stroke-width:1.5}
.acc{fill:#E9F0FB;stroke:#2F6FDB;stroke-width:2}
.pan{fill:#F3F1EC;stroke:#D6D3CC;stroke-width:1.5}
.ln{stroke:#9C9A94;stroke-width:1.75;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9C9A94"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text class="t" x="40" y="56">Schema per tenant</text>
<text class="s" x="40" y="88">One database holds a separate set of tables for each customer.</text>
<rect class="acc" x="440" y="122" width="320" height="78" rx="12"/>
<text class="h" x="600" y="155" text-anchor="middle">Application</text>
<text class="b" x="600" y="181" text-anchor="middle">Chooses the authorised tenant</text>
<rect class="pan" x="40" y="244" width="1120" height="256" rx="16"/>
<text class="k" x="600" y="280" text-anchor="middle">ONE POSTGRESQL DATABASE</text>
<path class="ln" d="M540 200V222H330V300" marker-end="url(#a)"/>
<path class="ln" d="M660 200V222H870V300" marker-end="url(#a)"/>
<rect class="box" x="120" y="304" width="420" height="156" rx="12"/>
<text class="h" x="330" y="350" text-anchor="middle">Acme schema</text>
<text class="m" x="330" y="386" text-anchor="middle">tenant_acme.orders</text>
<text class="m" x="330" y="414" text-anchor="middle">tenant_acme.users</text>
<rect class="box" x="660" y="304" width="420" height="156" rx="12"/>
<text class="h" x="870" y="350" text-anchor="middle">Bloom schema</text>
<text class="m" x="870" y="386" text-anchor="middle">tenant_bloom.orders</text>
<text class="m" x="870" y="414" text-anchor="middle">tenant_bloom.users</text>
<text class="b" x="600" y="540" text-anchor="middle">Separate tables  ·  Shared CPU, memory and disk  ·  Permissions still required</text>
</svg>
